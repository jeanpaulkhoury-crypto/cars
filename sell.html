<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sell Your Car | DriveVault</title><link rel="stylesheet" href="style.css"></head><body data-page="sell"><div id="site-header"></div><main><section class="page-hero"><div class="container"><div class="eyebrow">Seller tools</div><h1>Sell your car</h1><p class="muted">Create a demo listing; connect a production API before publishing live inventory.</p></div></section><section class="section"><div class="container"><form id="sellForm" class="panel grid"><div class="split"><div class="field"><label>Make</label><input name="make" required></div><div class="field"><label>Model</label><input name="model" required></div></div><div class="split"><div class="field"><label>Year</label><input name="year" type="number" required></div><div class="field"><label>Price USD</label><input name="price" type="number" required></div></div><div class="split"><div class="field"><label>Fuel</label><select name="fuel"><option>Petrol</option><option>Diesel</option><option>Electric</option><option>Hybrid</option></select></div><div class="field"><label>Transmission</label><select name="transmission"><option>Automatic</option><option>Manual</option></select></div></div><div class="split"><div class="field"><label>Type</label><select name="type"><option>SUV</option><option>Luxury</option><option>Performance</option><option>Electric</option><option>Sedan</option></select></div><div class="field"><label>Condition</label><select name="condition"><option>Used</option><option>New</option></select></div></div><div class="split"><div class="field"><label>Location</label><input name="location" required></div><div class="field"><label>Mileage km</label><input name="mileage" type="number"></div></div><div class="field"><label>Image URL</label><input name="image"></div><div class="field"><label>Description</label><textarea name="description"></textarea></div><button class="btn primary">Create Listing</button></form></div></section></main><div id="site-footer"></div><script src="data.js"></script><script src="app.js"></script></body></html>
